name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - name: Build (same as Vercel)
        run: bash vercel-build.sh
      - name: Copy lock (no words change without saving the lock)
        run: python3 studio/copylock.py check
      - name: Links, meta, structured data
        run: python3 studio/check.py
      - name: Agent server tests
        run: npm test
